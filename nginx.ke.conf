server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # Single-page app: unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Reverse proxy to the KE bridge. The variable + Docker DNS resolver defers
    # name resolution to request time so nginx still starts if ke-bridge is not
    # up yet. proxy_buffering off keeps the /bridge/events SSE stream flowing.
    location /bridge/ {
        resolver 127.0.0.11 valid=10s;
        set $ke_bridge http://ke-bridge:8090;
        rewrite ^/bridge/(.*)$ /$1 break;
        proxy_pass $ke_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
