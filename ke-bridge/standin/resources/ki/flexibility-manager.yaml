# FM producer-side patterns the stand-in ANSWERs. Must match the simulator
# bridge's consumer patterns (ke-bridge/resources/ki/flexibility-manager.yaml)
# and TM's ki/fm.yaml so the KE reasoner routes the ASK to this ANSWER.
knowledge_engine:
  kb_name: ""
  kb_description: ""
  graph_patterns:

    fm-ts-info-request:
      name: "fm-ts-info-request"
      description: "Exchange information about saref timeseries. Used in ANSWER,ASK."
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        time: "http://www.w3.org/2006/time#"
        saref: "https://saref.etsi.org/core/"
      pattern:
        - ' <http://fm.bluebird.com/>  rdf:type saref:Service . '
        - ' ?ts_interval_uri rdf:type time:Interval; time:hasBeginning ?ts_date_from; time:hasEnd ?ts_date_to .'
        - ' ?ts_uri rdf:type s4ener:TimeSeries ; s4ener:hasUsage ?ts_usage; '
        - ' s4ener:producedBy  <http://fm.bluebird.com/> ; s4ener:hasUpdateRate "PT15M"^^xsd:duration ; '
        - ' s4ener:hasCreationTime ?time_create ; s4ener:hasEffectivePeriod ?ts_interval_uri .'

    fm-ts:
      name: "fm-ts"
      description: "List of data points belonging to a saref timeseries. Used in ANSWER,ASK."
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      required_bindings:
        - "ts_uri"
      pattern:
        - ' ?ts_uri rdf:type s4ener:TimeSeries ;  s4ener:producedBy  <http://fm.bluebird.com/> . '
        - ' ?dp s4ener:belongsToTimeSeries ?ts_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;'
        - '   s4ener:hasEffectivePeriod ubmarket:period_15m ; saref:hasResult ?dpr.'
        - ' ubmarket:period_15m time:hasXSDDuration "PT15M"^^xsd:duration .'
        - ' ?dpr saref:hasValue ?value ; saref:isMeasuredIn om:megawatt .'
