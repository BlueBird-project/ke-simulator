# Phase 6 — full KE stack for the simulator.
#   KE Smart Connector + KE bridge + FM stand-in + frontend, on one network.
#
# Run from this directory:
#   docker compose up --build
# Then open http://localhost:8081  (badge should read "KE bridge: ke").
#
# NOTE: ke-bridge and fm-standin install the PRIVATE ke_client from GitHub. If
# the repo requires auth, provide a token at build time (see README.md).
#
# Without a Trading Manager in this stack there is no `tou-price` producer, so
# day-ahead prices fall back to ENTSO-E/mock; the FM path is fully real via the
# stand-in. To use a real TM instead, see README.md (attach to local_tm-net).

name: ke-simulator

services:
  ke-service:
    image: ghcr.io/tno/knowledge-engine/smart-connector:1.5.0
    environment:
      KE_RUNTIME_PORT: 8280
      KE_KB_WAIT_TIMEOUT: 15
      KE_HTTP_TIMEOUT: 10
    ports:
      - "8280:8280"
    networks: [ke-net]
    restart: unless-stopped

  ke-bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      KE_REST_ENDPOINT: http://ke-service:8280/rest/
      KE_KNOWLEDGE_BASE_ID: http://simulator.bluebird.com
      KE_KI_CONFIG_PATH: ./resources/ke_config.yml
      KE_VERIFY_SERVER_CERT: "false"
      KE_ALLOW_PARTIAL_KI: "true"
      PRICE_FORECAST_API_URL: http://taimu-prices:8000
    ports:
      - "8190:8090"  # host 8090-8093 already used by common-resources-nginx-1
    depends_on: [ke-service, taimu-prices]
    networks: [ke-net]
    restart: unless-stopped

  # Taimu forecasting API (FAST + Chronos-2), reusing the already-built demo
  # image but with a price-appropriate config (no positive_pv - see
  # ../resources/taimu/price_forecast_api_config.json). Separate instance/port
  # from any standalone Chronos-2 demo container (8000) so neither is disturbed.
  taimu-prices:
    image: fast-forecast-api:latest
    environment:
      FAST_API_CONFIG: /app/configs/price_forecast_api_config.json
    volumes:
      - ../resources/taimu/price_forecast_api_config.json:/app/configs/price_forecast_api_config.json:ro
      # Custom forge (not part of flexibility-manager) - fixes a real dtype
      # bug in FAST's future_df without clipping negative prices. See the
      # file's own docstring for the full justification.
      - ../resources/taimu/forge/coerce_numeric_y.py:/app/api/forge/coerce_numeric_y.py:ro
    networks: [ke-net]
    restart: unless-stopped

  fm-standin:
    build:
      context: ..
      dockerfile: standin/Dockerfile
    environment:
      KE_REST_ENDPOINT: http://ke-service:8280/rest/
      KE_KNOWLEDGE_BASE_ID: http://fm.bluebird.com
      KE_VERIFY_SERVER_CERT: "false"
      KE_ALLOW_PARTIAL_KI: "true"
    depends_on: [ke-service]
    networks: [ke-net]
    restart: unless-stopped

  tm-standin:
    build:
      context: ..
      dockerfile: standin/Dockerfile
    command: ["python", "standin/tm_standin.py"]
    environment:
      KE_REST_ENDPOINT: http://ke-service:8280/rest/
      KE_KNOWLEDGE_BASE_ID: http://tm.bluebird.com
      KE_VERIFY_SERVER_CERT: "false"
      KE_ALLOW_PARTIAL_KI: "true"
    depends_on: [ke-service]
    networks: [ke-net]
    restart: unless-stopped

  # Independent consumer stand-in: REACTs to price-forecast, proving the
  # forecast is genuinely delivered through the KE to a third, decoupled KB.
  forecast-consumer-standin:
    build:
      context: ..
      dockerfile: standin/Dockerfile
    command: ["python", "standin/forecast_consumer_standin.py"]
    environment:
      KE_REST_ENDPOINT: http://ke-service:8280/rest/
      KE_KNOWLEDGE_BASE_ID: http://forecast-consumer.bluebird.com
      KE_VERIFY_SERVER_CERT: "false"
      KE_ALLOW_PARTIAL_KI: "true"
    depends_on: [ke-service]
    networks: [ke-net]
    restart: unless-stopped

  # TEST producer: POSTs synthetic day-ahead prices (clearly logged as [TEST])
  # via the real KE, on a timer - no frontend button involved. Stands in for
  # a real Market Service, which does not POST prices through the KE yet
  # (confirmed: trading-manager only ANSWERs tou-price, see contracts/).
  # Triggers the Forecast Smart Connector's tou-price REACT automatically.
  market-service-standin:
    build:
      context: ..
      dockerfile: standin/Dockerfile
    command: ["python", "standin/market_service_standin.py"]
    environment:
      KE_REST_ENDPOINT: http://ke-service:8280/rest/
      KE_KNOWLEDGE_BASE_ID: http://test-market-producer.bluebird.com
      KE_VERIFY_SERVER_CERT: "false"
      KE_ALLOW_PARTIAL_KI: "true"
      PUBLISH_INTERVAL_SECONDS: "90"
    depends_on: [ke-service]
    networks: [ke-net]
    restart: unless-stopped

  ke-simulator:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_USE_KE: "true"
        VITE_KE_BRIDGE_URL: /bridge
        NGINX_CONF: nginx.ke.conf
    image: ke-simulator:ke
    ports:
      - "8282:80"  # host 8081 already used by an unrelated frontend-ke-simulator-1 container
    depends_on: [ke-bridge]
    networks: [ke-net]
    restart: unless-stopped

networks:
  ke-net:
    driver: bridge
